services:
  db:
    image: postgres:15-alpine
    container_name: physio-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: physio
    ports:
      - "5432:5432"
    volumes:
      - physio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d physio"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: physio-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: physio
      PORT: 3000
      JWT_SECRET: community-physio-demo-secret
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: physio-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  physio-pgdata:
